name: ICA2 CI/CD Pipeline

on:
  push:
    branches: [2.1-branch]  # Update if using another versioned branch
  pull_request:
    branches: [2.1-branch]

jobs:
  build-and-test-linux:
    runs-on: self-hosted  # Ubuntu self-hosted runner
    name: Build & Test on Linux
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install -r tests/requirements.txt

      - name: Create reports directory
        run: mkdir -p tests/reports

      - name: Recreate Docker Network and Start Services
        run: |
          docker network rm wordpress_github_actions_default || true
          docker-compose up -d

      - name: Run Selenium Login Test
        run: pytest tests/selenium_login_test.py --junitxml=tests/reports/login_test_report.xml

      - name: Upload Test Report as Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-report-linux
          path: tests/reports/login_test_report.xml

  build-and-test-windows:
    runs-on: self-hosted  # Windows self-hosted runner
    name: Build & Test on Windows
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install -r tests/requirements.txt

      - name: Create reports directory
        run: mkdir tests\reports

      - name: Recreate Docker Network and Start Services
        run: |
          docker network rm wordpress_github_actions_default || exit 0
          docker-compose up -d

      - name: Run Selenium Login Test
        run: pytest tests/selenium_login_test.py --junitxml=tests/reports/login_test_report.xml

      - name: Upload Test Report as Artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-report-windows
          path: tests/reports/login_test_report.xml

  docker-build-push:
    needs: [build-and-test-linux, build-and-test-windows]
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/wordpress-app:latest .
          docker push ghcr.io/${{ github.repository }}/wordpress-app:latest

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    name: Deploy Application
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulated Deployment
        run: |
          echo "Pulling image..."
          docker pull ghcr.io/${{ github.repository }}/wordpress-app:latest
          echo "Deploying to production..."
          echo "✅ Deployment complete!"
