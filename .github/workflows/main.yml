name: Build & Test on Self-Hosted Runners

on:
  push:
    branches: [2.1-branch]
  pull_request:
    branches: [2.1-branch]

jobs:
  build-test-windows:
    name: Build & Test on Windows Runner
    runs-on: self-hosted
    # Optional: specify a label if your Windows runner is labeled, e.g.:
    # labels: [windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10 (Windows)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (Windows)
        run: python -m pip install --upgrade pip && python -m pip install -r tests/requirements.txt

      - name: Create reports directory (Windows)
        run: mkdir tests\reports

      - name: Run Selenium login tests (Windows)
        run: python -m pytest tests/selenium_login_test.py --junitxml=tests/reports/login_test_report.xml

      - name: Upload Selenium test report (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-report-windows
          path: tests/reports/login_test_report.xml

  build-test-linux:
    name: Build & Test on Linux Runner
    runs-on: self-hosted
    # Optional: specify a label if your Linux runner is labeled, e.g.:
    # labels: [linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10 (Linux)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (Linux)
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r tests/requirements.txt

      - name: Create reports directory (Linux)
        run: mkdir -p tests/reports

      - name: Run Selenium login tests (Linux)
        run: python3 -m pytest tests/selenium_login_test.py --junitxml=tests/reports/login_test_report.xml

      - name: Upload Selenium test report (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-report-linux
          path: tests/reports/login_test_report.xml
