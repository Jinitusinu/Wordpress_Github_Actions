name: ICA2 CI/CD Pipeline (Windows Self-Hosted Runners)

on:
  push:
    branches: [2.1-branch]
  pull_request:
    branches: [2.1-branch]

jobs:
  build-and-test-windows-1:
    runs-on: self-hosted
    name: Build & Test on Windows Runner 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Python Version
        run: python --version

      - name: Install Dependencies
        run: pip install -r tests/requirements.txt

      - name: Create Reports Directory
        run: mkdir tests\reports

      - name: Clean Docker Network & Start Services
        run: |
          docker network rm wordpress_github_actions_default || exit 0
          docker-compose up -d

      - name: Run Selenium Login Tests
        run: pytest tests/selenium_login_test.py --junitxml=tests/reports/login_test_report.xml

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-report-windows-1
          path: tests/reports/login_test_report.xml

  build-and-test-windows-2:
    runs-on: self-hosted
    name: Build & Test on Windows Runner 2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Python Version
        run: python --version

      - name: Install Dependencies
        run: pip install -r tests/requirements.txt

      - name: Create Reports Directory
        run: mkdir tests\reports

      - name: Clean Docker Network & Start Services
        run: |
          docker network rm wordpress_github_actions_default || exit 0
          docker-compose up -d

      - name: Run Selenium Login Tests
        run: pytest tests/selenium_login_test.py --junitxml=tests/reports/login_test_report.xml

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-report-windows-2
          path: tests/reports/login_test_report.xml

  docker-build-push:
    needs: [build-and-test-windows-1, build-and-test-windows-2]
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/wordpress-app:latest .
          docker push ghcr.io/${{ github.repository }}/wordpress-app:latest

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    name: Deploy Application
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Deployment
        run: |
          echo "Pulling image..."
          docker pull ghcr.io/${{ github.repository }}/wordpress-app:latest
          echo "Deploying to production..."
          echo "✅ Deployment complete!"
